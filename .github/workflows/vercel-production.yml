# Deploy main to the polesebarbershop Vercel project on every push.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN          — https://vercel.com/account/tokens
#   VERCEL_ORG_ID         — Team/User ID (vercel whoami → id, or Project Settings → General)
#   VERCEL_PROJECT_ID     — prj_E4dMpfR7ExzCAwNGH2MwO30jsqAf
#
# Required Vercel production env vars (Project → Settings → Environment Variables):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, RESEND_FROM,
#   ADMIN_PASSWORD, ADMIN_EMAIL, OWNER_EMAIL,
#   NEXT_PUBLIC_SITE_URL=https://felicepolesebarbershop.vercel.app

name: Vercel production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Vercel GitHub integration already deploys main; this job is optional
    # and only runs when repository secrets are configured.
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
