# Produzione VPS — Felice Polese Barber Shop
# Dominio: felicepolesebarbershop.it
# I dati restano su Supabase (nessuna migrazione DB in questo compose).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://felicepolesebarbershop.it}
    container_name: felice-polese-app
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: felice-polese-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.active.conf = HTTP bootstrap oppure HTTPS (scritto da vps-bootstrap.sh)
      - ./deploy/nginx.active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - web

  # Rinnovo certificati Let's Encrypt (opzionale, periodico)
  certbot:
    image: certbot/certbot:latest
    container_name: felice-polese-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  web:
    driver: bridge
